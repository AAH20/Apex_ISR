[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-isr"
version = "0.1.0"
description = "Apex ISR — Intelligence, Surveillance, and Reconnaissance fusion toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Ahmed Hassan", email = "aah@a2zsoc.com"},
]
keywords = ["isr", "fusion", "kalman", "sgp4", "orbital", "track"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# The suite uses two import styles -- `from src.fusion...` (needs the repo root)
# and `from fusion...` after inserting src/ (needs src). Locally `python -m pytest`
# puts the CWD on sys.path so both resolve; CI runs bare `pytest`, which does not.
# Declaring the root explicitly makes collection invocation-independent.
pythonpath = ["."]
# CWD-independent quarantine: `--ignore=tests/_unimplemented` below is a RELATIVE
# path, so it silently no-ops whenever pytest is not invoked from the repo root.
# norecursedirs matches by directory NAME and is safe from any CWD.
norecursedirs = [
    ".*",
    "*.egg",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "_unimplemented",
]
addopts = "-v --tb=short --ignore=tests/_unimplemented"
